# Canonical blueprint lives at repo root: /render.yaml (Render auto-detects it).
# Keep this copy in sync for docs that link under hiring-ai/.

services:
  - type: web
    name: hiring-api
    runtime: python
    plan: free
    rootDir: hiring-ai/backend
    buildCommand: pip install -e .
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ENVIRONMENT
        value: staging
      - key: AUTH_MODE
        value: firebase
      - key: SEED_DEMO_TENANT
        value: "false"
      - key: FIREBASE_PROJECT_ID
        value: celestra-revenue-dev
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: CORS_ORIGINS
        value: https://celestra-revenue-dev.web.app,https://celestra-revenue-dev.firebaseapp.com
      - key: OAUTH_REDIRECT_URL
        value: https://celestra-revenue-dev.web.app/auth/callback
      - key: DATABASE_URL
        sync: false
      - key: FERNET_KEY
        sync: false
      - key: INVITE_CODE_PEPPER
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false

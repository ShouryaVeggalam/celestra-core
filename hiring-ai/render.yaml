# Hiring AI — permanent free API
# Blueprint: Render free web + Neon free Postgres (set DATABASE_URL in dashboard)
# App frontend: https://celestra-revenue-dev.web.app
#
# Deploy: https://dashboard.render.com/blueprints/new?repo=https%3A%2F%2Fgithub.com%2FShouryaVeggalam%2Fcelestra-core
# (select branch cursor/cloud-agent-1790260056834-2mexx if not on main yet)

services:
  - type: web
    name: hiring-api
    runtime: python
    plan: free
    rootDir: hiring-ai/backend
    buildCommand: pip install -e .
    startCommand: bash start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ENVIRONMENT
        value: staging
      - key: AUTH_MODE
        value: firebase
      - key: SEED_DEMO_TENANT
        value: "false"
      - key: FIREBASE_PROJECT_ID
        value: celestra-revenue-dev
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: CORS_ORIGINS
        value: https://celestra-revenue-dev.web.app,https://celestra-revenue-dev.firebaseapp.com
      - key: OAUTH_REDIRECT_URL
        value: https://celestra-revenue-dev.web.app/auth/callback
      - key: DATABASE_URL
        sync: false
      - key: FERNET_KEY
        sync: false
      - key: INVITE_CODE_PEPPER
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hiring-ai-backend"
version = "0.40.0"
description = "Hiring AI backend — Firebase auth for hosted pilots, dev Bearer for local"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.8",
  "cryptography>=42",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
  "alembic>=1.13",
  "psycopg2-binary>=2.9",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

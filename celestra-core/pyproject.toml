[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "celestra-core"
version = "0.7.0"
description = "Celestra Core — enterprise AI platform foundation for all Celestra applications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Celestra" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "psycopg2-binary>=2.9.10",
  "alembic>=1.14.0",
  "redis>=5.2.0",
  "celery>=5.4.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.28.0",
  "tenacity>=9.0.0",
  "orjson>=3.10.0",
  "python-json-logger>=2.0.7",
  "structlog>=24.4.0",
  "PyJWT>=2.9.0",
  "pwdlib[argon2]>=0.2.1",
  "email-validator>=2.2.0",
  "prometheus-client>=0.21.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "httpx>=0.28.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]

[project.scripts]
celestra-core = "core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "core*",
  "config*",
  "database*",
  "shared*",
  "auth*",
  "ai*",
  "agents*",
  "workflows*",
  "providers*",
  "memory*",
  "prompts*",
  "storage*",
  "notifications*",
  "analytics*",
  "monitoring*",
  "billing*",
  "knowledge*",
  "sdk*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
